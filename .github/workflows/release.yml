# This workflow will push the release branch when a release is created
# Generally based off: https://til.cazzulino.com/devops-ci-cd/push-to-protected-branch-from-github-actions
name: Release

on:
  release:
    types: [published]

# Default the GH_TOKEN env var to use a same-name secret if present
env:
  # token is part of gh env https://cli.github.com/manual/gh_help_environment
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 GH_TOKEN
        if: env.GH_TOKEN == ''
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: echo "GH_TOKEN=${GITHUB_TOKEN}" >> $GITHUB_ENV

      - name: 🤘 checkout
        uses: actions/checkout@v2
        with:
          token: ${{ env.GH_TOKEN }}

      - name: 🚀 push
        uses: ad-m/github-push-action@master
        with:
          branch: main
          force: true